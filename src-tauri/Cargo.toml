[package]
name = "tally"
version = "1.1.0"
description = "Tally — A fast, keyboard-first desktop financial workspace for macOS"
authors = ["hajadc"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
